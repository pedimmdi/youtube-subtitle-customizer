<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        YouTube Subtitle Customizer
    </title>

    <link
        rel="stylesheet"
        href="popup.css"
    >

</head>


<body>

    <div class="popup">

        <div class="header">

            <img
                src="icon.png"
                class="logo"
                alt="YSC"
            >

            <div>

                <div class="title">
                    Subtitle Customizer
                </div>

                <div class="subtitle">
                    YouTube Subtitle Tool
                </div>

            </div>

        </div>


        <div class="status">

            <div
                class="status-dot"
                id="status-dot"
            ></div>

            <span id="status-text">
                Checking YouTube...
            </span>

        </div>


        <div class="divider"></div>


        <div class="setting-row">

            <div class="setting-info">

                <div class="setting-title">
                    Auto Persian
                </div>

                <div class="setting-description">
                    Automatically enable Persian subtitles
                </div>

            </div>


            <label class="switch">

                <input
                    type="checkbox"
                    id="auto-persian"
                >

                <span class="slider"></span>

            </label>

        </div>


        <div class="setting-row">

            <div class="setting-info">

                <div class="setting-title">
                    Custom Subtitles
                </div>

                <div class="setting-description">
                    Use customized subtitle style
                </div>

            </div>


            <label class="switch">

                <input
                    type="checkbox"
                    id="custom-subtitles"
                >

                <span class="slider"></span>

            </label>

        </div>


        <div class="divider"></div>


        <button
            id="open-settings"
            class="button primary"
        >
            Open Subtitle Settings
        </button>


        <button
            id="refresh-subtitles"
            class="button secondary"
        >
            Re-enable Persian Subtitles
        </button>


        <div class="footer">
            YouTube Subtitle Customizer
        </div>

    </div>


    <script src="popup.js"></script>

</body>

</html>
